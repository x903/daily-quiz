{% extends "base.html" %}
{% block title %}登录 · 每日答题系统{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>登录</h1>
        <p class="sub">登录后开始每日答题、查看成绩与错题。</p>
        <form method="post" action="{{ url_for('login') }}">
            <div class="form-row">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-row">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn">登录</button>
        </form>
        <div class="demo-tip">
            默认演示账号：<br>
            管理员 <b>admin / admin123</b><br>
            普通用户 <b>user / user123</b>
        </div>
        <p class="auth-foot">还没有账号？<a href="{{ url_for('register') }}">立即注册</a></p>
    </div>
</div>
{% endblock %}
